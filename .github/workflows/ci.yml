name: CI

on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node v22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn lint --max-warnings 0
      - name: Run TypeCheck
        run: yarn build

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node v22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Run Tests
        run: yarn test --silent

  # npm publish するのはこのリポジトリで、公開されるのは dist/ を固めた tarball。
  # ユニットテストも e2e も in-process で回るため、ビルド・梱包の経路でだけ壊れる
  # 事故 (過去に shebang 欠落が 2 回) は test ジョブでは検出できない。
  packaging-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node v22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Run packaging smoke test
        run: yarn test:packaging

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no infra/secret files are tracked
        run: |
          hits=$(git ls-files | grep -E '(^\.aws/|(^|/)Dockerfile$|(^|/)deploy\.ya?ml$|^app/|(^|/)\.env$)' || true)
          if [ -n "$hits" ]; then
            echo "::error::Infra/secret files must never exist in the public repo:"; echo "$hits"; exit 1
          fi
          echo "guard passed: no infra/secret files tracked"
      - name: Setup Node v22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      # PRIVATE から同期した README が PRIVATE にしか無いパス (docs/ 等) を
      # 参照したままだと、この公開リポジトリでは 404 になる。人手の確認では
      # 再発するので落とす。
      - name: Ensure Markdown links resolve
        run: node scripts/check-markdown-links.mjs
