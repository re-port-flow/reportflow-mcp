name: CI

on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node v20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn lint --max-warnings 0
      - name: Run TypeCheck
        run: yarn build

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node v20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Run Tests
        run: yarn test --silent

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no infra/secret files are tracked
        run: |
          hits=$(git ls-files | grep -E '(^\.aws/|(^|/)Dockerfile$|(^|/)deploy\.ya?ml$|^app/|(^|/)\.env$)' || true)
          if [ -n "$hits" ]; then
            echo "::error::Infra/secret files must never exist in the public repo:"; echo "$hits"; exit 1
          fi
          echo "guard passed: no infra/secret files tracked"
